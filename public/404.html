<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Addit - Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // This script takes the current URL path and converts it to a query string
      // so the SPA can handle the routing client-side
      (function() {
        var pathSegmentsToKeep = 0; // For root domain deployment
        var l = window.location;

        // Store the path in sessionStorage and redirect to root
        var path = l.pathname.slice(1);
        var query = l.search;
        var hash = l.hash;

        // Redirect to index with path stored
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          path + (query ? '&' + query.slice(1) : '') + hash
        );
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>Redirecting to <a href="/">Addit</a>...</p>
    </noscript>
  </body>
</html>
